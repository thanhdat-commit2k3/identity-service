name: Continuous integration pipeline (Maven build, Test, Package, Docker)
run-name: ${{ github.actor }}
on:
  push:
    branches:
      - master

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      - name: Run test (Unit test, Integration test)
        run: mvn test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend-service:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/backend-service:latest
