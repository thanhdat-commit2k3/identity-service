services:
  mysql:
    image: mysql:8.0.45-debian
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "090303"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: identity_service
    ports:
      - "3308:3306"

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p090303" ]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-service:
    image: thanhdat2k3/identity-service:0.9.0
    container_name: identity-service
    ports:
      - "8080:8080"
    environment:
      DBMS_CONNECTION: jdbc:mysql://mysql:3306/identity_service
      DBMS_USERNAME: root
      DBMS_PASSWORD: "090303"
    depends_on:
      mysql:
        condition: service_healthy